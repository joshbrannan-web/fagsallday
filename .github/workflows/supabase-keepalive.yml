name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 "${SUPABASE_URL}/rest/v1/" -H "apikey: ${SUPABASE_API_KEY}" -H "Authorization: Bearer ${SUPABASE_API_KEY}") || code="000"
            echo "Attempt $i: Supabase responded with HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then echo "Keep-alive succeeded"; exit 0; fi
            echo "Not ready yet, waiting 20s before retry..."
            sleep 20
          done
          echo "No successful response from Supabase after 5 attempts - keep-alive failed"
          exit 1          
