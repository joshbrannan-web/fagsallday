name: Supabase Keep-Alive
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "${SUPABASE_URL}/auth/v1/health" -H "apikey: ${SUPABASE_API_KEY}")
          echo "Supabase responded with HTTP $code"
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "No response from Supabase - keep-alive failed"; exit 1
          fi
